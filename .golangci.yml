version: "2"

linters:
  default: all
  disable:
    - gomodguard
    - depguard
    - err113
    - exhaustruct
    - mnd
    - wrapcheck
    - forbidigo
    - revive
    - wsl
    - funlen
    - dupl
    - lll
    - noinlineerr
  settings:
    exhaustruct_v5:
      allow-empty-returns: true
      ignore-patterns:
        # std libs
        - '^net/http\.Client$'
        - '^net/http\.Cookie$'
        - '^net/http\.Request$'
        - '^net/http\.Response$'
        - '^net/http\.Server$'
        - '^net/http\.Transport$'
        - '^net/url\.URL$'
        - '^os/exec\.Cmd$'
        - '^reflect\.StructField$'
        # mygo
        - '^github\.com/egoist/mygo\.WindowOptions$'
        - '^github\.com/egoist/mygo/plugins/updater\.Options$'

    varnamelen:
      ignore-decls:
        - c *colly.Collector
        - i int
        - wg sync.WaitGroup
        - e *colly.HTMLElement
        - gh *github.Provider
        - mu sync.Mutex
        - mu sync.RWMutex
        - t *time.Timer

  exclusions:
    paths:
      - .agents/
      - .github/
      - .mygo/
      - .svelte-kit/
      - .vscode/
      - assets/
      - build/
      - dist/
      - src/
      - node_modules/
    rules:
      - path: _test\.go
        linters:
          - goconst
