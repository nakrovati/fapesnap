version: "2"

linters:
  default: all
  disable:
    - gomodguard
    - depguard
    - err113
    - exhaustruct
    - mnd
    - wrapcheck
    - forbidigo
    - revive
    - wsl
    - funlen
    - dupl
    - lll
    - noinlineerr
  settings:
    exhaustruct_v5:
      allow-empty-returns: true
      ignore-patterns:
        # std libs
        - '^net/http\.Client$'
        - '^net/http\.Cookie$'
        - '^net/http\.Request$'
        - '^net/http\.Response$'
        - '^net/http\.Server$'
        - '^net/http\.Transport$'
        - '^net/url\.URL$'
        - '^os/exec\.Cmd$'
        - '^reflect\.StructField$'
        # wails
        - '^github\.com/wailsapp/wails/v3/pkg/application\.Options$'
        - '^github\.com/wailsapp/wails/v3/pkg/application\.AssetOptions$'
        - '^github\.com/wailsapp/wails/v3/pkg/application\.MacOptions$'
        - '^github\.com/wailsapp/wails/v3/pkg/application\.WebviewWindowOptions$'
        - '^github\.com/wailsapp/wails/v3/pkg/application\.MacWindow$'
        - '^github\.com/wailsapp/wails/v3/pkg/updater\.Config$'
        - '^github\.com/wailsapp/wails/v3/pkg/updater/providers/github\.Config$'

    varnamelen:
      ignore-decls:
        - c *colly.Collector
        - i int
        - wg sync.WaitGroup
        - e *colly.HTMLElement
        - gh *github.Provider
        - mu sync.Mutex
        - mu sync.RWMutex
        - t *time.Timer

  exclusions:
    paths:
      - .github/
      - .task/
      - .vscode/
      - assets/
      - bin/
      - build/
      - frontend/
    rules:
      - path: _test\.go
        linters:
          - goconst
