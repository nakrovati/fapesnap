name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            artifact: fapesnap-linux-amd64.tar.gz

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: fapesnap-linux-arm64.tar.gz

          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: fapesnap-darwin-arm64.app.zip
            dmg: fapesnap-darwin-arm64.dmg

          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: fapesnap-windows-amd64.exe

          - os: windows-latest
            goos: windows
            goarch: arm64
            artifact: fapesnap-windows-arm64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Build
        run: wails3 build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Package macOS DMG
        if: matrix.goos == 'darwin'
        run: |
          wails3 task darwin:package:dmg
          mv bin/fapesnap.dmg "${{ matrix.dmg }}"

      - name: Archive macOS app
        if: matrix.goos == 'darwin'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            bin/fapesnap.app \
            "${{ matrix.artifact }}"

      - name: Archive Linux binary
        if: matrix.goos == 'linux'
        run: tar -czf "${{ matrix.artifact }}" -C bin fapesnap

      - name: Copy Windows binary
        if: matrix.goos == 'windows'
        shell: bash
        run: cp bin/fapesnap.exe "${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: fapesnap-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS DMG
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: fapesnap-${{ matrix.goos }}-${{ matrix.goarch }}.dmg
          path: ${{ matrix.dmg }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Detect prerelease
        id: prerelease
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ (alpha|beta|rc) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: HYBRID
          configurationJson: |
            {
              "commit_template": "- #{{MERGE_SHA}} #{{TITLE}}",
              "categories": [
                {
                  "title": "## ✨ Features",
                  "labels": ["feat", "feature"]
                },
                {
                  "title": "## 🔧 Fixes",
                  "labels": ["fix", "bug"]
                },
                {
                  "title": "## 📦 Other",
                  "labels": []
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.github_release.outputs.changelog }}
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
          files: artifacts/**/*
